<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>🐍 贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #eee;
    user-select: none;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 30px;
    margin-bottom: 15px;
  }
  .score-box {
    background: #16213e;
    padding: 10px 24px;
    border-radius: 12px;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .score-box span { color: #f9ca24; font-size: 28px; }
  canvas {
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 60px rgba(100,200,100,0.15);
    background: #0f0f1a;
  }
  .controls {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: #16213e;
    color: #eee;
    border: 2px solid #333;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: bold;
  }
  button:hover { background: #1a3a5c; border-color: #f9ca24; }
  button.active { background: #27ae60; border-color: #2ecc71; }
  .hint {
    margin-top: 12px;
    font-size: 13px;
    color: #888;
  }
  .game-over-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 40px;
    font-weight: bold;
    color: #e74c3c;
    text-shadow: 0 0 20px rgba(231,76,60,0.6);
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>

<div class="header">
  <div class="score-box">🍎 <span id="score">0</span></div>
  <div class="score-box">🏆 <span id="best">0</span></div>
</div>

<div style="position:relative;">
  <canvas id="canvas"></canvas>
  <div id="gameOver" class="game-over-overlay">游戏结束!</div>
</div>

<div class="controls">
  <button id="btnStart" onclick="startGame()">▶ 开始游戏</button>
  <button onclick="togglePause()">⏯️ 暂停</button>
  <button onclick="resetGame()">🔄 重新开始</button>
</div>
<div class="hint">⬆⬇⬅➡ 方向键 | P 暂停 | 空格 开始</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 游戏配置
const GRID = 20;
const COLS = 30;
const ROWS = 22;
const WIDTH = COLS * GRID;
const HEIGHT = ROWS * GRID;
canvas.width = WIDTH;
canvas.height = HEIGHT;

// 游戏状态
let snake = [];
let food = {};
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let score = 0;
let bestScore = localStorage.getItem('snakeBest') || 0;
let gameLoop = null;
let gameRunning = false;
let gamePaused = false;
let speed = 85;

document.getElementById('best').textContent = bestScore;

// 初始化
function initGame() {
  const startX = Math.floor(COLS / 2);
  const startY = Math.floor(ROWS / 2);
  snake = [
    { x: startX, y: startY },
    { x: startX - 1, y: startY },
    { x: startX - 2, y: startY },
  ];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  score = 0;
  speed = 85;
  document.getElementById('score').textContent = score;
  document.getElementById('gameOver').style.display = 'none';
  placeFood();
}

function placeFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  const available = [];
  for (let x = 0; x < COLS; x++) {
    for (let y = 0; y < ROWS; y++) {
      if (!occupied.has(`${x},${y}`)) available.push({ x, y });
    }
  }
  if (available.length === 0) return; // 胜利!
  food = available[Math.floor(Math.random() * available.length)];
}

function update() {
  direction = { ...nextDirection };
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  // 碰墙检测
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    gameOver();
    return;
  }
  // 碰自己检测
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  // 吃食物
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    placeFood();
    // 加速
    if (speed > 45) speed -= 1;
    clearInterval(gameLoop);
    gameLoop = setInterval(update, speed);
  } else {
    snake.pop();
  }
}

function gameOver() {
  gameRunning = false;
  clearInterval(gameLoop);
  document.getElementById('gameOver').style.display = 'block';
  document.getElementById('btnStart').textContent = '▶ 开始游戏';
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('snakeBest', bestScore);
    document.getElementById('best').textContent = bestScore;
  }
}

function draw() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  // 网格线
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * GRID, 0); ctx.lineTo(x * GRID, HEIGHT); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * GRID); ctx.lineTo(WIDTH, y * GRID); ctx.stroke();
  }

  // 食物 - 带脉冲动画
  const pulse = 1 + Math.sin(Date.now() / 200) * 0.2;
  ctx.save();
  ctx.translate(food.x * GRID + GRID/2, food.y * GRID + GRID/2);
  ctx.scale(pulse, pulse);
  ctx.shadowColor = 'rgba(255,80,80,0.8)';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#ff5252';
  ctx.beginPath();
  ctx.arc(0, 0, GRID/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#ff7979';
  ctx.arc(-3, -3, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 蛇身
  snake.forEach((seg, i) => {
    const t = 1 - i / Math.max(snake.length, 1);
    const r = Math.round(46 + t * 100);
    const g = Math.round(180 + t * 40);
    const b = Math.round(80 + t * 60);
    const alpha = 1 - i * 0.01;

    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.shadowColor = `rgba(${r},${g},${b},0.5)`;
    ctx.shadowBlur = i === 0 ? 12 : 4;

    const pad = i === 0 ? 2 : 3;
    const radius = i === 0 ? 7 : 5;
    roundRect(seg.x * GRID + pad, seg.y * GRID + pad, GRID - pad*2, GRID - pad*2, radius);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // 蛇头眼睛
  if (snake.length > 0) {
    const head = snake[0];
    const cx = head.x * GRID + GRID/2;
    const cy = head.y * GRID + GRID/2;
    let ex1, ey1, ex2, ey2;
    if (direction.x === 1) { ex1=cx+3; ey1=cy-5; ex2=cx+3; ey2=cy+5; }
    else if (direction.x === -1) { ex1=cx-3; ey1=cy-5; ex2=cx-3; ey2=cy+5; }
    else if (direction.y === -1) { ex1=cx-5; ey1=cy-3; ex2=cx+5; ey2=cy-3; }
    else { ex1=cx-5; ey1=cy+3; ex2=cx+5; ey2=cy+3; }

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex1, ey1, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2, ey2, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(ex1, ey1, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2, ey2, 1.8, 0, Math.PI*2); ctx.fill();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// 渲染循环
function render() {
  draw();
  requestAnimationFrame(render);
}

function startGame() {
  if (gameRunning && !gamePaused) return;
  if (!gameRunning) {
    initGame();
    gameRunning = true;
    gamePaused = false;
    gameLoop = setInterval(update, speed);
    document.getElementById('btnStart').textContent = '🟢 游戏中';
    document.getElementById('gameOver').style.display = 'none';
  }
}

function togglePause() {
  if (!gameRunning) return;
  gamePaused = !gamePaused;
  if (gamePaused) {
    clearInterval(gameLoop);
    document.getElementById('btnStart').textContent = '⏸ 已暂停';
  } else {
    gameLoop = setInterval(update, speed);
    document.getElementById('btnStart').textContent = '🟢 游戏中';
  }
}

function resetGame() {
  clearInterval(gameLoop);
  gameRunning = false;
  gamePaused = false;
  initGame();
  document.getElementById('btnStart').textContent = '▶ 开始游戏';
  document.getElementById('gameOver').style.display = 'none';
  draw();
}

// 键盘控制
document.addEventListener('keydown', (e) => {
  if (!gameRunning || gamePaused) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); startGame(); }
    return;
  }
  switch (e.key) {
    case 'ArrowUp':    if (direction.y === 0) nextDirection = { x: 0, y: -1 }; e.preventDefault(); break;
    case 'ArrowDown':  if (direction.y === 0) nextDirection = { x: 0, y: 1 };  e.preventDefault(); break;
    case 'ArrowLeft':  if (direction.x === 0) nextDirection = { x: -1, y: 0 }; e.preventDefault(); break;
    case 'ArrowRight': if (direction.x === 0) nextDirection = { x: 1, y: 0 };  e.preventDefault(); break;
    case 'p':
    case 'P': togglePause(); break;
    case ' ': startGame(); e.preventDefault(); break;
  }
});

// 触屏滑动支持
let touchStart = null;
canvas.addEventListener('touchstart', (e) => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
canvas.addEventListener('touchend', (e) => {
  if (!touchStart || !gameRunning || gamePaused) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 20 && direction.x === 0) nextDirection = { x: 1, y: 0 };
    else if (dx < -20 && direction.x === 0) nextDirection = { x: -1, y: 0 };
  } else {
    if (dy > 20 && direction.y === 0) nextDirection = { x: 0, y: 1 };
    else if (dy < -20 && direction.y === 0) nextDirection = { x: 0, y: -1 };
  }
});

// 初始化
initGame();
render();
</script>
</body>
</html>
