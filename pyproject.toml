[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "leoclaw"
version = "0.1.0"
description = "A small workspace-scoped ReAct coding agent CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langchain-deepseek>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "rich>=13.8,<16",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
leoclaw = "leoclaw.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leoclaw"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
